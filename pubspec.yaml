name: trydos_wallet
publish_to: none
description: "مكتبة محفظة Trydos - سحب، إيداع، ومعاملات. صفحة البداية وواجهات المحفظة."
version: 0.0.1
homepage: https://gitlab.com/trydos_app/trydos_wallet
repository: https://gitlab.com/trydos_app/trydos_wallet.git

environment:
  sdk: ^3.9.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.3
  mobile_scanner: ^7.1.2
  dio: ^5.7.0
  socket_io_client: ^3.0.2
  flutter_bloc: ^8.1.6
  image_picker: 1.0.6
  uuid: ^4.5.1
  share_plus: ^12.0.1
  # Opens a merchant's successUrl ("return to the shop") in the browser. It is
  # never treated as proof of payment — see MerchantPaymentResult.successUrl.
  url_launcher: ^6.1.14
  path_provider: ^2.1.5
  gal: ^2.3.2
  pretty_qr_code: ^3.6.0
  shimmer: ^3.0.0
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.1.4
  pointycastle: ^3.9.1
  flutter_screenutil: ^5.9.0
  cupertino_back_gesture: ^0.1.0
  dotted_border: ^2.1.0
  camera: ^0.11.0+2
  google_mlkit_object_detection: ^0.13.0
  # Face contours for the steadying overlay. Not face_mesh_detection: that
  # gives 468 points but ships for Android only, and the wallet needs both
  # platforms. Contours (~130 points) draw the same web on iPhone too.
  # Pinned to the 0.11.x line, not the newest: 0.13 wants
  # google_mlkit_commons ^0.11, which object_detection 0.13 cannot share.
  # Raise both together or not at all.
  google_mlkit_face_detection: ^0.11.1
  image: ^4.2.0
  permission_handler: ^11.3.1
  flutter_spinkit: ^5.2.0
  # Analytics / Session Replay. The HOST app owns Posthog().setup() + PostHogWidget;
  # the library only calls the singleton API (screen/capture) and masking widgets.
  posthog_flutter: ^5.24.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # Native side of AWS Face Liveness. The challenge (oval, countdown, light
  # sequence) is an Amplify UI component that only exists for Jetpack Compose
  # and SwiftUI, so the package ships it itself rather than asking the host to
  # wire it up.
  #
  # Host build minimums this imposes: Android minSdk 24, iOS 14.0.
  plugin:
    platforms:
      android:
        package: com.trydos.trydos_wallet
        pluginClass: TrydosWalletPlugin
      ios:
        pluginClass: TrydosWalletPlugin

  assets:
    - assets/svg/
    - assets/png/
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images
  fonts:
    - family: Quicksand-Regular
      fonts:
        - asset: assets/fonts/Quicksand/Quicksand-Regular.ttf
    - family: Quicksand-Medium
      fonts:
        - asset: assets/fonts/Quicksand/Quicksand-Medium.ttf
    - family: Quicksand-Bold
      fonts:
        - asset: assets/fonts/Quicksand/Quicksand-Bold.ttf
    - family: Quicksand-Light
      fonts:
        - asset: assets/fonts/Quicksand/Quicksand-Light.ttf

