# Sized for an 8 GB machine: the Gradle and Kotlin daemons are separate JVMs,
# so both heaps plus the OS have to fit in physical memory. Asking for more
# than the machine has makes the Kotlin daemon fail while flushing its
# incremental caches ("Could not close incremental caches").
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m
# The project lives on D: while the pub cache (plugin sources) lives on C:.
# Kotlin 2.3 stores source paths relative to the project root, and Windows
# cannot express a relative path across drive letters, so closing the
# incremental caches throws "this and base files have different roots".
# Remove this once the pub cache and the project share one drive (PUB_CACHE).
kotlin.incremental=false

android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
